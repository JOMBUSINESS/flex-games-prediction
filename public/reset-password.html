<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | FLEX GAMES</title><link rel="stylesheet" href="/css/style.css">
  <script src="/config.js"></script>
</head>
<body>
  <main class="auth-overlay" style="min-height:100vh"><section class="auth-card">
    <a href="/" class="brand">FLEX <span>GAMES</span></a><h2>Choose a new password</h2>
    <form id="reset-form">
      <label for="password">New password</label><div class="password-wrap">
        <input id="password" name="password" type="password" autocomplete="new-password" required>
        <button class="password-toggle" type="button" data-password-target="password">Show</button>
      </div>
      <label for="confirmPassword">Confirm new password</label><div class="password-wrap">
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
        <button class="password-toggle" type="button" data-password-target="confirmPassword">Show</button>
      </div>
      <button class="btn btn-primary" type="submit">Update Password</button>
    </form>
    <p id="reset-message" class="message" role="status"></p><p><a href="/">Return to FLEX GAMES</a></p>
  </section></main>
  <script>
    const API_BASE = window.FLEX_API_URL || "";
    const token = new URLSearchParams(location.search).get("token") || "";
    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-password-target]");
      if (!button) return;
      const input = document.getElementById(button.dataset.passwordTarget);
      const visible = input.type === "password";
      input.type = visible ? "text" : "password";
      button.textContent = visible ? "Hide" : "Show";
      button.setAttribute("aria-label", visible ? "Hide password" : "Show password");
    });
    document.getElementById("reset-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.getElementById("reset-message");
      if (!token) { message.textContent = "This reset link is invalid or expired."; return; }
      const data = Object.fromEntries(new FormData(event.target));
      try {
        const response = await fetch(API_BASE + "/api/auth/password/reset", {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...data, token })
        });
        const result = await response.json();
        message.textContent = result.message || "Unable to update password.";
        if (response.ok) event.target.hidden = true;
      } catch { message.textContent = "Unable to connect to the server."; }
    });
  </script>
</body>
</html>
