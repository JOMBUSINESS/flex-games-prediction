databases:
  - name: flex-games-prediction-db
    databaseName: flex_games_prediction
    user: flex_games_user
    plan: basic-256mb

services:
  - type: web
    name: flex-games-prediction-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flex-games-prediction-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: REQUIRE_PHONE_VERIFICATION
        value: "false"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
